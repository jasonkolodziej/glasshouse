name: Release

# Push a tag like v0.1.0 to build Glasshouse (the Rust app) for macOS and Linux and publish a
# GitHub release with the archives. "Run workflow" builds the same archives without releasing,
# as downloadable workflow artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (universal .app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; the script adds both Apple targets.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry, git dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and bundle Glasshouse.app
        run: scripts/package-macos.sh

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: glasshouse-macos
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # winit links libxkbcommon; ImageMagick resizes the icon for the hicolor theme.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev imagemagick

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry, git dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and package
        run: scripts/package-linux.sh

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: glasshouse-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestations: a Sigstore certificate from the run's OIDC token.
      id-token: write
      attestations: write
    steps:
      # Only for packaging/allowed_signers, which checks the signature below.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: packaging

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # SHA256SUMS.txt.sig, for people without `gh`: verified with ssh-keygen, which macOS and
      # Linux both ship. The secret is the private half of the key in packaging/allowed_signers.
      - name: Sign the checksums with the release SSH key
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SSH_SIGNING_KEY }}
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::Set the RELEASE_SSH_SIGNING_KEY secret to sign the release."
            exit 1
          fi
          key=$RUNNER_TEMP/release_signing_key
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          ssh-keygen -q -Y sign -f "$key" -n file dist/SHA256SUMS.txt
          # Fails the release if the secret isn't the published key.
          ssh-keygen -Y verify -f packaging/allowed_signers -I jasonkolodziej -n file \
            -s dist/SHA256SUMS.txt.sig < dist/SHA256SUMS.txt

      # For `gh attestation verify FILE --repo OWNER/REPO`: proves each file was built by this
      # workflow from this commit, with no key to keep.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt

      # A release made on GitHub's web form creates the tag, which starts this run, so the release
      # can exist before the builds finish. Then add the files to it and keep its title and notes.
      - name: Create the GitHub release, or add the files to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists: uploading the files to it."
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Glasshouse $GITHUB_REF_NAME" \
              --generate-notes \
              $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
          fi
